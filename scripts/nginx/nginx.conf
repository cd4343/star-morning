# ============================================================
# Star Coin / 星辰早晨 — Windows Nginx 配置
# 用途：取代 python scripts/server.py（80 端口静态文件 + API 转发）。
# 使用前必改：把下方 root 的 C:/path/to/starcoin 替换为项目实际根目录，
#            Windows 路径在 nginx 里必须使用正斜杠 /（如 D:/work/starcoin）。
# 本文件是独立配置包，放着不动不影响现行 python 部署。
# ============================================================

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # 与后端上传限制对齐：单文件 5MB（base64 膨胀约 1/3）+ JSON 包裹，留足余量
    client_max_body_size 25m;

    # gzip 全套文本类型
    gzip               on;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject;

    server {
        listen       80;
        server_name  _;

        # ↓↓↓ 替换为实际前端构建目录（注意正斜杠），例如 D:/work/starcoin/frontend/dist
        root   C:/path/to/starcoin/frontend/dist;
        index  index.html;

        # Vite 构建产物带内容 hash，可放心缓存一年
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # API 反向代理到 Node 后端（3001）
        location /api {
            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 上传的媒体文件（探索照片/语音等）也由后端提供
        location /uploads {
            proxy_pass       http://127.0.0.1:3001;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SPA 路由回退：刷新 /child/xxx 等前端路由时返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
